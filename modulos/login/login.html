<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso al sistema de gestión Vale FISE">
  <title>Iniciar sesión | FISE</title>
  <link rel="stylesheet" href="estilos_login.css?v=20260814-2">
<link rel="stylesheet" href="../../tema_oscuro.css?v=20260814-1">
</head>
<body class="pagina-acceso">
  <main class="pagina-login">
    <section class="tarjeta-login" aria-label="Inicio de sesión FISE">
      <div class="panel-marca">
        <img class="logo-paulet" src="../../img/logo_paulet.png" alt="Paulet">
        <img class="logo-fise" src="../../img/logo_fise.png" alt="FISE, Fondo de Inclusión Social Energético">
      </div>

      <div class="panel-formulario">
        <form class="formulario" id="formularioLogin" action="../vale-fise/valefise.html" method="get" novalidate>
          <div class="encabezado"><h1>Bienvenido</h1></div>

          <label class="campo">
            <span class="solo-lectores">Correo electrónico</span>
            <span class="icono" aria-hidden="true">♙</span>
            <input type="email" name="correo" value="renzo" placeholder="Correo electrónico" autocomplete="username">
          </label>

          <label class="campo campo-clave">
            <span class="solo-lectores">Contraseña</span>
            <span class="icono" aria-hidden="true">▣</span>
            <input id="clave" type="password" name="clave" value="123456" placeholder="Contraseña" autocomplete="current-password">
            <button class="ver-clave" id="verClave" type="button" aria-label="Mostrar contraseña" aria-pressed="false">◉</button>
          </label>

          <div class="selector" id="selectorPerfil">
            <input id="perfil" type="hidden" name="perfil" value="vale-fise">
            <button class="campo boton-selector" id="botonPerfil" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="icono" aria-hidden="true">▦</span><span id="perfilSeleccionado">Vale FISE</span><span class="flecha" aria-hidden="true">⌄</span>
            </button>
            <div class="lista-perfiles" id="listaPerfiles" role="listbox" aria-label="Seleccionar perfil" hidden>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="administrador">Administrador</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="bonogas">BonoGas</button>
              <button class="opcion-perfil activa" type="button" role="option" aria-selected="true" data-value="vale-fise">Vale FISE</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="ahorro-gnv">Ahorro GNV</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="fotovoltaico">Fotovoltaico</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="masificacion">Masificación</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="electricidad-al-toque">Electricidad al toque</button>
              <button class="opcion-perfil" type="button" role="option" aria-selected="false" data-value="mcter">MCTER</button>
            </div>
          </div>

          <a class="recuperar" href="#">¿Olvidó su contraseña?</a>
          <button class="boton-ingresar" type="submit">Ingresar</button>
        </form>
      </div>
    </section>
  </main>
  <script src="../../scripts_generales.js"></script>
</body>
</html>
